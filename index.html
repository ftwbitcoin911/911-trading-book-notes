<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6只美股ETF 5年 &amp; 10年全景对比（实时回测）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh; padding: 48px 20px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  h1 {
    font-size: 30px; text-align: center; margin-bottom: 8px;
    background: linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 24px; }

  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 16px; margin-bottom: 32px; font-size: 13px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; }
  .d-smh  { background: linear-gradient(90deg,#f43f5e,#fb7185); }
  .d-soxx { background: linear-gradient(90deg,#8b5cf6,#a78bfa); }
  .d-spy  { background: linear-gradient(90deg,#10b981,#34d399); }
  .d-qqq  { background: linear-gradient(90deg,#3b82f6,#60a5fa); }
  .d-vgt  { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .d-vti  { background: linear-gradient(90deg,#06b6d4,#22d3ee); }

  .section {
    background: rgba(30,41,59,.55); border: 1px solid rgba(148,163,184,.12);
    border-radius: 18px; padding: 32px 28px; margin-bottom: 32px;
    backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .section h2 {
    font-size: 20px; margin-bottom: 24px; color: #f1f5f9;
    display: flex; align-items: center; gap: 10px;
  }
  .section h2::before {
    content: ''; width: 4px; height: 22px; border-radius: 2px;
    background: linear-gradient(180deg,#38bdf8,#a78bfa);
  }

  .sub-title {
    font-size: 15px; font-weight: 700; color: #cbd5e1;
    margin: 28px 0 16px; padding-left: 4px;
  }
  .sub-title:first-of-type { margin-top: 0; }

  .row { margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 7px; font-size: 14px;
  }
  .name { font-weight: 600; }
  .name small { color: #64748b; font-weight: 400; font-size: 11px; margin-left: 6px; }
  .val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .bar-bg {
    height: 11px; background: rgba(148,163,184,.1);
    border-radius: 6px; overflow: hidden;
  }
  .bar {
    height: 100%; border-radius: 6px; width: 0;
    transition: width 1.1s cubic-bezier(.16,1,.3,1);
  }

  .b-smh  { background: linear-gradient(90deg,#f43f5e,#fb7185); }
  .b-soxx { background: linear-gradient(90deg,#8b5cf6,#a78bfa); }
  .b-spy  { background: linear-gradient(90deg,#10b981,#34d399); }
  .b-qqq  { background: linear-gradient(90deg,#3b82f6,#60a5fa); }
  .b-vgt  { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .b-vti  { background: linear-gradient(90deg,#06b6d4,#22d3ee); }

  .c-smh  { color: #fb7185; }
  .c-soxx { color: #a78bfa; }
  .c-spy  { color: #34d399; }
  .c-qqq  { color: #60a5fa; }
  .c-vgt  { color: #fbbf24; }
  .c-vti  { color: #22d3ee; }

  .note {
    margin-top: 36px; font-size: 12px; color: #64748b;
    text-align: center; line-height: 2;
  }
  .note strong { color: #94a3b8; }

  .status {
    text-align: center; font-size: 12px; margin-bottom: 20px;
    color: #64748b; min-height: 20px;
  }
  .status.error { color: #f87171; }
  .status.loading { color: #fbbf24; }
  .status.ok { color: #34d399; }

  .badge {
    display: inline-block; font-size: 10px; padding: 2px 6px;
    border-radius: 4px; margin-left: 6px; font-weight: 500;
    vertical-align: middle;
  }
  .badge-live { background: rgba(52,211,153,.15); color: #34d399; }
  .badge-cache { background: rgba(96,165,250,.15); color: #60a5fa; }
  .badge-fallback { background: rgba(251,191,36,.15); color: #fbbf24; }
  .badge-error { background: rgba(248,113,113,.15); color: #f87171; }
</style>
</head>
<body>
<div class="wrap">
  <h1>6只美股ETF 5年 &amp; 10年全景对比</h1>
  <p class="sub">总回报 · 年化收益率(CAGR) · 年化波动率 · 最大回撤 &nbsp;|&nbsp; 含分红再投资 · 每次打开自动回测最新数据</p>

  <div class="status" id="status">正在获取最新数据...</div>

  <div class="legend">
    <span><i class="dot d-smh"></i>SMH 半导体（集中）</span>
    <span><i class="dot d-soxx"></i>SOXX 半导体（均衡）</span>
    <span><i class="dot d-spy"></i>SPY 标普500</span>
    <span><i class="dot d-qqq"></i>QQQ 纳斯达克100</span>
    <span><i class="dot d-vgt"></i>VGT 科技板块</span>
    <span><i class="dot d-vti"></i>VTI 全市场</span>
  </div>

  <div class="section" id="section5y">
    <h2>5 年维度 <span id="badge5y"></span></h2>
    <div id="content5y"></div>
  </div>

  <div class="section" id="section10y">
    <h2>10 年维度 <span id="badge10y"></span></h2>
    <div id="content10y"></div>
  </div>

  <p class="note">
    赛道越窄，收益越高，波动与回撤也越大 · <strong>SMH &gt; SOXX &gt; VGT &gt; QQQ &gt; SPY ≈ VTI</strong><br>
    数据实时回测生成，含分红再投资；仅供学习参考，不构成投资建议
  </p>
</div>

<script>
(function(){
  const TICKERS = ['SMH','SOXX','SPY','QQQ','VGT','VTI'];
  const META = {
    SMH:  { name:'SMH',  desc:'半导体（集中）', color:'smh'  },
    SOXX: { name:'SOXX', desc:'半导体（均衡）', color:'soxx' },
    SPY:  { name:'SPY',  desc:'标普500',       color:'spy'  },
    QQQ:  { name:'QQQ',  desc:'纳斯达克100',    color:'qqq'  },
    VGT:  { name:'VGT',  desc:'科技板块',       color:'vgt'  },
    VTI:  { name:'VTI',  desc:'全市场',         color:'vti'  }
  };

  const FALLBACK = {
    SMH:  { 5:{totalReturn:350,  cagr:35.1, annualVol:45, maxDrawdown:-50}, 10:{totalReturn:1783, cagr:33.1, annualVol:38, maxDrawdown:-50} },
    SOXX: { 5:{totalReturn:257,  cagr:28.9, annualVol:42, maxDrawdown:-46}, 10:{totalReturn:980,  cagr:27.1, annualVol:35, maxDrawdown:-46} },
    VGT:  { 5:{totalReturn:185,  cagr:23.3, annualVol:26, maxDrawdown:-35}, 10:{totalReturn:720,  cagr:23.1, annualVol:24, maxDrawdown:-35} },
    QQQ:  { 5:{totalReturn:95,   cagr:14.3, annualVol:22, maxDrawdown:-33}, 10:{totalReturn:526,  cagr:20.0, annualVol:20, maxDrawdown:-33} },
    SPY:  { 5:{totalReturn:82,   cagr:12.7, annualVol:14, maxDrawdown:-24}, 10:{totalReturn:301, cagr:14.9, annualVol:14, maxDrawdown:-24} },
    VTI:  { 5:{totalReturn:78,   cagr:12.2, annualVol:15, maxDrawdown:-25}, 10:{totalReturn:290, cagr:14.6, annualVol:15, maxDrawdown:-25} }
  };

  const CACHE_KEY = 'us_etf_backtest_v2';
  const CACHE_TTL = 24 * 3600 * 1000;

  const statusEl = document.getElementById('status');
  const badge5y = document.getElementById('badge5y');
  const badge10y = document.getElementById('badge10y');

  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }
  function setBadge(el, text, type){
    el.innerHTML = text ? `<span class="badge badge-${type}">${text}</span>` : '';
  }

  async function fetchYahoo(ticker, host){
    const url = `https://${host}/v8/finance/chart/${ticker}?range=12y&interval=1d&includeAdjustedClose=true`;
    const res = await fetch(url, { credentials:'omit' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const result = json?.chart?.result?.[0];
    if(!result) throw new Error('无数据返回');

    const timestamps = result.timestamp || [];
    const closes = result.indicators?.adjclose?.[0]?.adjclose || result.indicators?.quote?.[0]?.close;
    if(!closes || closes.length === 0) throw new Error('无收盘价');

    const data = [];
    for(let i=0; i<timestamps.length; i++){
      const p = closes[i];
      if(p != null && !isNaN(p) && p > 0){
        data.push({ t: timestamps[i], p });
      }
    }
    if(data.length < 100) throw new Error('有效数据不足');
    return data;
  }

  async function fetchStooq(ticker){
    const url = `https://stooq.com/q/d/l/?s=${ticker.toLowerCase()}.us&i=d`;
    const res = await fetch(url, { credentials:'omit' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if(!text || text.length < 100) throw new Error('CSV 为空');
    const lines = text.trim().split('\n');
    if(lines.length < 100) throw new Error('CSV 行数不足');

    const data = [];
    for(let i=1; i<lines.length; i++){
      const parts = lines[i].split(',');
      if(parts.length < 5) continue;
      const dateStr = parts[0];
      const close = parseFloat(parts[4]);
      if(!isNaN(close) && close > 0){
        const ts = Math.floor(new Date(dateStr + 'T00:00:00Z').getTime() / 1000);
        if(!isNaN(ts)) data.push({ t: ts, p: close });
      }
    }
    if(data.length < 100) throw new Error('有效数据不足');
    return data;
  }

  async function fetchTickerMulti(ticker){
    const sources = [
      { name:'Yahoo query1', fn: () => fetchYahoo(ticker, 'query1.finance.yahoo.com') },
      { name:'Yahoo query2', fn: () => fetchYahoo(ticker, 'query2.finance.yahoo.com') },
      { name:'Stooq', fn: () => fetchStooq(ticker) }
    ];
    let lastErr;
    for(const src of sources){
      try{
        const data = await src.fn();
        return { data, source: src.name };
      } catch(e){
        lastErr = e;
        console.warn(`[${ticker}] ${src.name} 失败:`, e.message);
      }
    }
    throw new Error(`${ticker} 全部数据源失败: ${lastErr?.message || '未知错误'}`);
  }

  function loadCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const obj = JSON.parse(raw);
      if(Date.now() - obj.ts > CACHE_TTL) return null;
      const first = obj.calc && obj.calc[TICKERS[0]];
      if(!first || !first.stats5 || first.stats5.cagr === undefined) return null;
      return obj;
    } catch(e){ return null; }
  }

  function saveCache(payload){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), ...payload })); } catch(e){}
  }

  function computeStats(data, startTs, endTs, years){
    const slice = data.filter(d => d.t >= startTs && d.t <= endTs);
    if(slice.length < 20) return null;

    const startPrice = slice[0].p;
    const endPrice = slice[slice.length-1].p;
    const totalReturn = (endPrice / startPrice - 1) * 100;

    const actualYears = (slice[slice.length-1].t - slice[0].t) / (365.25 * 24 * 3600);
    let cagr = 0;
    if(actualYears > 0.5 && startPrice > 0){
      cagr = (Math.pow(endPrice / startPrice, 1 / actualYears) - 1) * 100;
    } else if(years > 0){
      cagr = (Math.pow(endPrice / startPrice, 1 / years) - 1) * 100;
    }

    const returns = [];
    for(let i=1; i<slice.length; i++) returns.push(slice[i].p / slice[i-1].p - 1);
    const n = returns.length;
    const mean = returns.reduce((a,b)=>a+b,0) / n;
    const variance = returns.reduce((a,r)=>a + (r - mean) ** 2, 0) / (n - 1);
    const dailyStd = Math.sqrt(variance);
    const annualVol = dailyStd * Math.sqrt(252) * 100;

    let peak = slice[0].p;
    let maxDD = 0;
    for(const d of slice){
      if(d.p > peak) peak = d.p;
      const dd = (d.p - peak) / peak;
      if(dd < maxDD) maxDD = dd;
    }
    const maxDrawdown = maxDD * 100;

    return { totalReturn, cagr, annualVol, maxDrawdown };
  }

  function renderGroup(title, rows){
    let html = `<div class="sub-title">${title}</div>`;
    const valid = rows.filter(r => r.stats !== null);
    if(valid.length === 0){ return html + '<p style="color:#64748b;font-size:13px;">暂无有效数据</p>'; }

    const values = valid.map(r => Math.abs(r.stats[r.key]));
    const maxVal = Math.max(...values, 0.0001);

    for(const row of rows){
      const m = META[row.ticker];
      const s = row.stats;
      const colorCls = `c-${m.color}`;
      const barCls = `b-${m.color}`;

      let valText, pctWidth;
      if(s === null || s[row.key] === undefined){
        valText = '—'; pctWidth = 0;
      } else {
        const v = s[row.key];
        if(row.key === 'totalReturn'){ valText = (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
        else if(row.key === 'cagr'){ valText = (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
        else if(row.key === 'annualVol'){ valText = '~' + v.toFixed(1) + '%'; }
        else { valText = v.toFixed(1) + '%'; }
        pctWidth = Math.abs(v) / maxVal * 100;
      }

      html += `
      <div class="row">
        <div class="label">
          <div class="name">${m.name} <small>${m.desc}</small></div>
          <div class="val ${colorCls}">${valText}</div>
        </div>
        <div class="bar-bg">
          <div class="bar ${barCls}" style="width:0%;" data-w="${pctWidth.toFixed(1)}%"></div>
        </div>
      </div>`;
    }
    return html;
  }

  function animateBars(container){
    container.querySelectorAll('.bar').forEach((el, i) => {
      const w = el.dataset.w;
      setTimeout(() => { el.style.width = w; }, 50 + i * 30);
    });
  }

  function renderAll(calc, sourceLabel, sourceType){
    const c5 = document.getElementById('content5y');
    const rows5 = (key) => TICKERS.map(t => ({ ticker:t, stats: calc[t].stats5, key }));
    c5.innerHTML =
      renderGroup('5年总回报（%）', rows5('totalReturn')) +
      renderGroup('5年年化收益率 CAGR（%）', rows5('cagr')) +
      renderGroup('年化波动率（%）', rows5('annualVol')) +
      renderGroup('最大回撤（%）', rows5('maxDrawdown'));

    const c10 = document.getElementById('content10y');
    const rows10 = (key) => TICKERS.map(t => ({ ticker:t, stats: calc[t].stats10, key }));
    c10.innerHTML =
      renderGroup('10年总回报（%）', rows10('totalReturn')) +
      renderGroup('10年年化收益率 CAGR（%）', rows10('cagr')) +
      renderGroup('年化波动率（%）', rows10('annualVol')) +
      renderGroup('最大回撤（%）', rows10('maxDrawdown'));

    setBadge(badge5y, sourceLabel, sourceType);
    setBadge(badge10y, sourceLabel, sourceType);

    animateBars(c5);
    animateBars(c10);
  }

  function buildFallbackCalc(){
    const calc = {};
    for(const t of TICKERS){
      calc[t] = { stats5:{...FALLBACK[t][5]}, stats10:{...FALLBACK[t][10]} };
    }
    return calc;
  }

  async function main(){
    const cached = loadCache();
    if(cached && cached.calc){
      renderAll(cached.calc, '缓存数据', 'cache');
      setStatus(`已显示缓存数据（${new Date(cached.ts).toLocaleString('zh-CN')}）· 正在后台刷新...`, 'loading');
    } else {
      renderAll(buildFallbackCalc(), '兜底数据 · 加载中', 'fallback');
      setStatus('正在获取最新数据...', 'loading');
    }

    try{
      const allData = {};
      let anyLive = false;

      for(const t of TICKERS){
        setStatus(`正在获取 ${t} 数据...`, 'loading');
        try{
          const { data } = await fetchTickerMulti(t);
          allData[t] = data;
          anyLive = true;
        } catch(e){
          console.warn(`[${t}] 实时获取失败，将使用兜底数据`, e);
          allData[t] = null;
        }
      }

      if(!anyLive) throw new Error('所有实时数据源均不可用');

      const now = Date.now();
      const secPerYear = 365.25 * 24 * 3600;
      const fiveYearsAgo = now - 5 * secPerYear * 1000;
      const tenYearsAgo = now - 10 * secPerYear * 1000;

      const calc = {};
      let liveCount = 0, fallbackCount = 0;

      for(const t of TICKERS){
        const d = allData[t];
        if(d && d.length >= 100){
          const stats5 = computeStats(d, fiveYearsAgo, now, 5);
          const stats10 = computeStats(d, tenYearsAgo, now, 10);
          if(stats5 && stats10){
            calc[t] = { stats5, stats10 };
            liveCount++;
            continue;
          }
        }
        calc[t] = { stats5:{...FALLBACK[t][5]}, stats10:{...FALLBACK[t][10]} };
        fallbackCount++;
      }

      let label, type;
      if(fallbackCount === 0){ label = '实时数据'; type = 'live'; }
      else if(liveCount === 0){ label = '兜底数据'; type = 'fallback'; }
      else { label = `混合（${liveCount}实时/${fallbackCount}兜底）`; type = 'fallback'; }

      renderAll(calc, label, type);
      setStatus(`数据已更新 · ${new Date().toLocaleString('zh-CN')} · ${label}`, 'ok');

      if(liveCount >= 4){ saveCache({ calc }); }
    } catch(err){
      console.error('实时获取全部失败：', err);
      renderAll(buildFallbackCalc(), '兜底数据', 'fallback');
      setStatus('实时数据获取失败，已显示内置兜底数据（近似值）· 仅供参考', 'error');
    }
  }

  main();
})();
</script>
</body>
</html>
